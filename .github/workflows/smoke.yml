name: Emulator smoke test

# Installs the latest released APK on an emulator, opens home and a video, and keeps logcat + screenshots.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video to open'
        required: false
        default: 'https://www.youtube.com/watch?v=jNQXAC9IVRw'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ${{ github.repository }} -p SmartTube-Phone-arm64.apk -O app.apk
          ls -la app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
