name: Build Phone APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ ".github/smoke.sh", ".github/workflows/smoke.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PHONE_SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Phone changes to the MediaServiceCore submodule (Shorts feed)
      - name: Apply submodule patches
        run: git -C MediaServiceCore apply --ignore-whitespace --whitespace=nowarn ../.github/patches/mediaservicecore.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version name
        id: get_version
        run: |
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-phone-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      # Same key every build, so new APKs install as updates over old ones.
      - name: Configure signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "${{ secrets.PHONE_SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/phone.p12
          echo "storePassword=${{ secrets.PHONE_KEY_PASSWORD }}" > keystore.properties
          echo "keyAlias=smarttubephone" >> keystore.properties
          echo "keyPassword=${{ secrets.PHONE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/phone.p12" >> keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStphoneRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp ./smarttubetv/build/outputs/apk/stphone/release/*_arm64-v8a.apk out/SmartTube-Phone-arm64.apk

      - name: Show signer and version
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BT/apksigner verify --print-certs out/SmartTube-Phone-arm64.apk | grep -E "SHA-256|DN"
          $BT/aapt dump badging out/SmartTube-Phone-arm64.apk | head -n 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: out/SmartTube-Phone-arm64.apk
          if-no-files-found: error

      # Public, sign-in free download: releases/latest/download/SmartTube-Phone-arm64.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SmartTube Phone ${{ steps.get_version.outputs.VERSION_NAME }}
          body: |
            SmartTube for phones. arm64 only.
            Direct download: https://github.com/${{ github.repository }}/releases/latest/download/SmartTube-Phone-arm64.apk
          files: out/SmartTube-Phone-arm64.apk
          make_latest: true
